<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>Daymark | Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="Daymark home"><span class="brand-mark">d</span><span>daymark</span></a>
        <div class="workspace-label">YOUR WORKSPACE</div>
        <nav class="nav-list" aria-label="Main navigation">
          <a class="nav-item active" href="#tasks"><span class="nav-icon">▤</span> My tasks <span class="nav-count" id="nav-count">0</span></a>
        </nav>
        <div class="sidebar-bottom"><span class="avatar">Y</span><span class="profile-name">Your workspace</span><span class="more-icon">···</span></div>
      </aside>

      <main class="main-content" id="tasks">
        <header class="topbar"><span class="breadcrumb">Workspace <span>/</span> My tasks</span><span class="today" id="today-label"></span></header>
        <section class="page-heading">
          <div><p class="eyebrow">A CLEARER DAY STARTS HERE</p><h1>My tasks<span class="heading-dot">.</span></h1><p class="subtitle">Make room for what matters.</p></div>
          <button class="primary-button" id="new-task-button" type="button"><span aria-hidden="true">+</span> New task</button>
        </section>

        <section class="overview" aria-label="Task summary">
          <div class="overview-copy"><span class="overview-kicker">YOUR MOMENTUM</span><strong id="progress-label">Ready when you are</strong><span class="overview-note" id="progress-note">Add a task to get started.</span></div>
          <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div><span class="progress-count" id="progress-count">0 / 0</span></div>
          <div class="overview-spark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </section>

        <section class="task-section">
          <div class="section-heading"><div><h2>All tasks <span class="section-total" id="section-total">0</span></h2><p>Small steps add up.</p></div>
            <div class="filters" role="group" aria-label="Filter tasks">
              <button class="filter-button selected" data-filter="all" type="button">All</button>
              <button class="filter-button" data-filter="active" type="button">In progress</button>
              <button class="filter-button" data-filter="completed" type="button">Completed</button>
            </div>
          </div>
          <div class="task-list" id="task-list" aria-live="polite"></div>
        </section>
        <p class="footer-note">One thing at a time.</p>
      </main>
    </div>

    <dialog class="task-dialog" id="task-dialog">
      <form id="task-form">
        <div class="dialog-heading"><div><p class="eyebrow">MAKE IT HAPPEN</p><h2 id="dialog-title">Create a task</h2></div><button class="icon-button" id="close-dialog" type="button" aria-label="Close dialog">×</button></div>
        <label class="field-label" for="task-title">Task name</label>
        <input class="text-input" id="task-title" name="title" maxlength="120" placeholder="What needs doing?" required>
        <label class="field-label" for="task-description">A few details <span class="optional">Optional</span></label>
        <textarea class="text-input description-input" id="task-description" name="description" maxlength="500" placeholder="Add a note or a little context..."></textarea>
        <p class="form-error" id="form-error" role="alert"></p>
        <div class="dialog-actions"><button class="secondary-button" id="cancel-dialog" type="button">Cancel</button><button class="primary-button" type="submit" id="save-task">Create task</button></div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
